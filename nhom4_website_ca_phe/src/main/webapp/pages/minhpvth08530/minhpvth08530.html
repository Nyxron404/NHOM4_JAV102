<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/shared.css?v=20261119e">
    <link rel="stylesheet" href="../../assets/css/minhpvth08530.css?v=20261119e">
    <link rel="stylesheet" href="../../assets/css/minhpvth08530-tai-khoan.css?v=20261119e">
    <title>Quản lý sản phẩm - Quản lý bán hàng</title>
</head>
<body>
    <div id="header"></div>

    <!-- Thanh tiêu đề giống các trang Tài khoản / Nhân viên -->
    <div class="acc-title">
        <h1>Quản lý sản phẩm <span class="title-sub">Sản phẩm, biến thể, hồ sơ hương vị, ảnh, gói bán và giá bán</span></h1>
        <button class="btn-big primary" id="btnAddProduct">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2Z"/></svg> THÊM SẢN PHẨM</button>
    </div>

    <main class="pm">

        <div class="pm-layout">
            <!-- Cột trái: danh sách sản phẩm -->
            <aside class="panel pm-side">
                <div class="search-box">
                    <span class="search-icon">⌕</span>
                    <input type="search" id="searchInput" autocomplete="off"
                           placeholder="Tìm tên hoặc mã (không dấu)">
                </div>
                <div class="seg" id="productStatusFilter">
                    <button type="button" class="active" data-status="">Tất cả</button>
                    <button type="button" data-status="ACTIVE">Đang bán</button>
                    <button type="button" data-status="INACTIVE">Ngừng KD</button>
                </div>
                <div class="list-meta" id="productCount"></div>
                <div id="productList" class="product-list"></div>
            </aside>

            <!-- Cột phải: chi tiết sản phẩm, biến thể, gói bán -->
            <section class="pm-main" id="mainPanel"></section>
        </div>
    </main>

    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root"></div>

    <script>
        // Bấm vào "Tài khoản" để mở/đóng menu (header chung)
        function toggleMenu() {
            document.getElementById("accountMenu").classList.toggle("show");
        }
        window.addEventListener("click", function (e) {
            const menu = document.getElementById("accountMenu");
            if (menu && !e.target.closest(".account")) {
                menu.classList.remove("show");
            }
        });
    </script>
    <script src="../../assets/js/shared.js?v=20261119e"></script>
    <script src="../../assets/js/minhpvth08530.js?v=20261119e"></script>
</body>
</html>
